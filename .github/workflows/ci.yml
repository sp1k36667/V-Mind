name: Rust checks
# Feature-Branches laufen nur über ihre PR, nicht zusätzlich per push. Überholte
# Läufe derselben PR werden abgebrochen; Läufe auf main und manuelle Läufe haben
# je eine eigene Gruppe (run_id) und werden nie ersetzt oder abgebrochen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
  # Die Gesamtsuite nutzt Unix-Werkzeuge; portable Dateipfad-/Sicherungstests
  # laufen zusätzlich auf macOS und Windows.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Build
        run: cargo build --workspace --locked
      - name: Backup and database filename runtime tests
        run: cargo test --locked -p vmind-cli --test backup_paths
