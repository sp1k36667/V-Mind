name: Release
# Ein Tag wie v0.2.0 baut fertige Programme für Linux, macOS und Windows und
# veröffentlicht sie als GitHub-Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Build
        run: cargo build --release --locked -p vmind-cli
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/vmind README.md README.de.md LICENSE CHANGELOG.md CONTRIBUTING.md AGENTS.md dist/
          cp -R docs prompts examples dist/
          tar -czf "vmind-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/vmind.exe, README.md, README.de.md, LICENSE, CHANGELOG.md, CONTRIBUTING.md, AGENTS.md dist/
          Copy-Item -Recurse docs, prompts, examples dist/
          Compress-Archive -Path dist/* -DestinationPath "vmind-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"
      - name: Extract and check package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir extracted
          tar -xzf "vmind-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C extracted
          python3 scripts/check_release_package.py extracted
      - name: Extract and check package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path "vmind-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip" -DestinationPath extracted
          python scripts/check_release_package.py extracted
      - uses: actions/upload-artifact@v4
        with:
          name: vmind-${{ matrix.name }}
          path: vmind-*.*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum vmind-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --title "V-Mind $GITHUB_REF_NAME" --generate-notes
