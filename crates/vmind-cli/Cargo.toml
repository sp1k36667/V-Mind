[package]
name = "vmind-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vmind"
path = "src/main.rs"

[dependencies]
vmind-core = { path = "../vmind-core" }
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
