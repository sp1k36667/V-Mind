[workspace]
members = ["crates/vmind-core", "crates/vmind-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# SQLite wird mitgebaut: gleiche Version mit FTS5 auf allen Systemen, kein libsqlite3-dev nötig.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
